<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Links</title>
</head>
<body>
    <!-- Link básico -->
    <a href="outra_pagina.html" title="Ir para outra página">Ir para outra página</a>
    
    <!-- Link para abrir em uma nova janela -->
    <a href="outra_pagina.html" target="_blank" title="Abrir em nova janela">Ir para outra página (nova janela)</a>
    
    <!-- Link para iniciar composição de e-mail -->
    <a href="mailto:destinatario@exemplo.com" title="Enviar e-mail">Enviar e-mail</a>
</body>
</html>
