<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Imagem</title>
</head>
<body>

  <img id="animais" src="animais.jpg" alt="animais" usemap="#animalmap">

  <map name="animalmap">
    <area shape="rect" coords="1,1,100,100" alt="tucano" href="tucano.jpg">
    <area shape="rect" coords="130,1,300,300" alt="onça" href="onça.jpg">
  </map>

</body>
</html>
