<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Estados</title>
    <style>
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th, td {
        border: 1px solid #000;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
      thead {
        background-color: #ccc;
      }
      tfoot {
        background-color: #ccc;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
          <tr>
          <th>Estado</th>
          <th>População</th>
          <th>Região</th>
          <th>Capital</th>
          </tr>
      </thead>
    <tbody>
          <tr>
          <td><a href="https://pt.wikipedia.org/wiki/Acre">Acre</a></td>
          <td>894,470</td>
          <td>Norte</td>
          <td>Rio Branco</td>
          </tr>
          <tr>
        <td><a href="https://pt.wikipedia.org/wiki/Amap%C3%A1">Amapá</a></td>
        <td>861,773</td>
        <td>Norte</td>
        <td>Macapá</td>
    </tbody>
    <tfoot>
        <tr>
        <td colspan="4"><strong>Total Geral > 10</strong></td>
        </tr>
    </tfoot>
  </table>
</body>
