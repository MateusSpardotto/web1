<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    
    /* Estilo para os itens da lista */
    li {
      margin-bottom: 10px; /* Adiciona um espaçamento inferior entre os itens */
      font-size: 18px; /* Define o tamanho da fonte */
      color: #a31919; /* Define a cor do texto */
    }

    /* Estilo de hover para os itens da lista */
    li:hover {
      background-color: #911818; /* Altera a cor de fundo quando o mouse passa por cima */
      cursor: pointer; /* Altera o cursor para indicar interatividade */
    }

  </style>
<body>
    <ul>
        <li >Caerne</li>
        <li >Pão de alho</li>
        <li >Cerveja</li>
    </ul>

    <p>Atributo type permite mudar o tipo da lista ordenada</p>
    <ol type="I">
        <li>Mateus</li>
        <li>Romulo</li>
        <li>Joãozinho</li>
    </ol>

    <dl>
        <dt>Picanha</dt>
        <dd>Carne.</dd>
      
        <dt>Pao de alho</dt>
        <dd>Pão e alho</dd>
      
        <dt>Cerveja</dt>
        <dd>Liquido</dd>
      </dl>
</body>
</html>
